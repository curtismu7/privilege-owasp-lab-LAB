name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 26 only (owner decision 2026-10-31).
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: bash scripts/check-ui-standard.sh
      - run: npm test
      - run: npm run build
      - run: PORT=7811 npm run doctor
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --redact -v
      - name: forbidden strings (history)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -z "$FORBIDDEN_STRINGS" ]; then echo "FORBIDDEN_STRINGS secret missing"; exit 1; fi
          printf '%s\n' "$FORBIDDEN_STRINGS" > /tmp/forbidden-strings.txt
          hits=$(git log -p --all | grep -cF -f /tmp/forbidden-strings.txt || true)
          echo "forbidden-string hits: $hits"
          [ "$hits" = "0" ]
      - name: No AI attribution
        if: ${{ !cancelled() }}
        run: bash scripts/check-no-ai-attribution.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the app (mock, loopback)
        run: |
          PORT=7811 nohup npm start -w server > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7811/api/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1
      - run: npm run e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-screenshots
          SHOT_DIR: ${{ runner.temp }}/e2e-screenshots
      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            ${{ runner.temp }}/e2e-screenshots
            .data/e2e-screenshots
            e2e-output
          retention-days: 7
